name: Publish Snapshots

on:
  push:
    branches:
      - 'main'
    # '*' does not cross '/', so each plane tag shape needs its own pattern
    # (see release.yml) — otherwise a release tag push starts a snapshot run
    # whose Gradle build derives a release version and fails on signing
    tags-ignore:
      - 'v*'
      - 'core/v*'
      - 'mcp/v*'
      - 'llm-anthropic/v*'
      - 'llm-openai/v*'
      - 'go-parser/v*'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    env: # make secrets available to all steps in this job
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
    steps:
      - uses: actions/checkout@v3
        with:
          # Full history and tags: the project version is derived from git tags
          # by gradle/version-from-tag.gradle, and snapshot publishing needs the
          # real version, not the 0.0.0-SNAPSHOT tarball fallback
          fetch-depth: 0
          fetch-tags: true
      - name: Check version
        id: version-check
        run: |
          # Tag-derived versioning (scripts/derive-version.sh mirrors
          # gradle/version-from-tag.gradle): main builds are always the latest
          # release tag + -SNAPSHOT
          VERSION=$(scripts/derive-version.sh)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION is a snapshot - will publish"
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION is a release - skipping publish"
          fi
      - name: Prepare test JDK
        if: steps.version-check.outputs.is_snapshot == 'true' && github.ref_type != 'tag'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: "21.0.3"
      - name: Publish
        # Belt-and-suspenders: a tag checkout can slip past the tags-ignore
        # list, and then Gradle derives a release version (signing required,
        # no signing secrets here) instead of a snapshot
        if: steps.version-check.outputs.is_snapshot == 'true' && github.ref_type != 'tag'
        run: |
          # Publish all modules, including io.btrace:jafar-shell (the unified shell jar, whose
          # publication lives in :jfr-shell) so the jafar-shell-latest JBang alias resolves
          ./gradlew publish publishToMavenLocal --max-workers=1 --no-build-cache --stacktrace --info --no-watch-fs --no-daemon
          cd jafar-gradle-plugin
          ./gradlew publish --max-workers=1 --no-build-cache --stacktrace --info --no-watch-fs --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
