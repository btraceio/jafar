name: Go Parser Benchmarks

# The Go parser benchmarks need a large recording. This job generates one with the
# test-recordings module (about 1 GiB, 180 chunks, deterministic, so allocation
# counts stay comparable run to run) and publishes the numbers, rather than
# leaving them to whatever recording a developer happens to have locally. To
# benchmark real recordings, run ./get_resources.sh and point JAFAR_BENCH_JFR at them.
#
# Benchmarks are slow and noisy, so this does not run on every push: it runs on
# demand, on a schedule, when the parser changes on main, and on any branch
# named bench/* for a branch that has not been merged yet.

on:
  workflow_dispatch:
    inputs:
      benchtime:
        description: 'go test -benchtime value (e.g. 3x, 10x, 2s)'
        required: false
        default: '3x'
      count:
        description: 'go test -count value. benchstat needs at least 6 samples for a confidence interval, so raise this when comparing against a baseline.'
        required: false
        default: '3'
      pattern:
        description: 'Benchmark name pattern (go test -bench)'
        required: false
        default: '.'
      baseline_ref:
        description: 'Optional git ref to compare against (benchstat diff). Must be a ref whose benchmarks accept JAFAR_BENCH_JFR as a path list.'
        required: false
        default: ''
  schedule:
    # Weekly, Monday 04:17 UTC. Off the hour to avoid the scheduling stampede.
    - cron: '17 4 * * 1'
  # On main, whenever the parser changes. Also on any branch under bench/, which
  # is how a branch that is not merged yet gets benchmarked: workflow_dispatch
  # only works for workflows already on the default branch, so push the branch
  # as bench/<something> instead. GitHub applies one path filter to both, so a
  # bench/ branch has to carry a change under go-parser/ - which it does, since
  # that is the point of benchmarking it.
  push:
    branches:
      - 'main'
      - 'bench/**'
    paths:
      - 'go-parser/**'
      - '.github/workflows/go-parser-bench.yml'

concurrency:
  group: go-parser-bench-${{ github.ref }}
  # A benchmark run is expensive and its results are the point; do not throw one
  # away because another commit landed while it was running.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # inputs.* is empty for schedule and push, so these fall back to the cheap
  # settings while a workflow_dispatch run picks up the richer input defaults
  # below. The benchmark recording is large - about 1 GiB - and every
  # benchmark iteration parses a whole file, so an unattended run
  # takes one sample per benchmark. Allocation counts are deterministic and stay
  # exact at one iteration, which is the signal worth tracking over time; timing
  # at one sample is indicative, so raise these by hand when timing is the point.
  BENCHTIME: ${{ inputs.benchtime || '1x' }}
  BENCHCOUNT: ${{ inputs.count || '1' }}
  BENCHPATTERN: ${{ inputs.pattern || '.' }}

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    # A full workflow_dispatch sweep at 3x/3 took roughly 40 minutes over the
    # previous 2 GB downloaded corpus; generating the recording adds a few minutes.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so a baseline ref can be checked out for comparison.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # The recordings are generated rather than downloaded (test-recordings
      # module): the small ones the correctness tests read, and one large
      # multi-chunk recording for the benchmarks, written a chunk at a time.
      - name: Set up JDK 21 for the recording generator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Generate recordings
        run: |
          ./gradlew --no-daemon :test-recordings:generateTestRecordings \
            :test-recordings:generateBenchmarkRecording \
            -Pchunks=180 -PsamplesPerChunk=200000 \
            -Poutput="$PWD/build/bench-recordings/large-ap.jfr"
          # The benchmarks read the large recording and the checked-in TCK one.
          echo "JAFAR_BENCH_JFR=$PWD/build/bench-recordings/large-ap.jfr:$PWD/jfr-shell-tck/src/main/resources/tck-test.jfr" >> "$GITHUB_ENV"

      - name: Report available recordings
        run: |
          echo "### Recordings" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # The parser is only benchmarked against recordings that are actually
          # present, so record which ones the run saw.
          find parser-core/src/test/resources demo/src/test/resources jfr-shell-tck/src/main/resources build/bench-recordings \
            -name '*.jfr' -printf '%p\t%s bytes\n' 2>/dev/null | sort | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # A benchmark that measures a broken parser measures nothing, so the
      # correctness tests run first - against the generated recordings too.
      - name: Test against every available recording
        working-directory: go-parser
        run: go test -v ./...

      - name: Run benchmarks
        working-directory: go-parser
        run: |
          set -o pipefail
          go test -run '^$' \
            -bench "$BENCHPATTERN" \
            -benchtime "$BENCHTIME" \
            -count "$BENCHCOUNT" \
            -benchmem \
            -timeout 80m \
            ./... 2>&1 | tee ../bench-current.txt

      - name: Benchmark the baseline
        if: inputs.baseline_ref != ''
        run: |
          set -o pipefail
          git worktree add ../baseline "${{ inputs.baseline_ref }}"
          # The same recordings as the current run (JAFAR_BENCH_JFR, set when they
          # were generated), so the two are comparable.
          cd ../baseline/go-parser
          go test -run '^$' \
            -bench "$BENCHPATTERN" \
            -benchtime "$BENCHTIME" \
            -count "$BENCHCOUNT" \
            -benchmem \
            -timeout 80m \
            ./... 2>&1 | tee "$GITHUB_WORKSPACE/bench-baseline.txt"

      - name: Compare against the baseline
        if: inputs.baseline_ref != ''
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          {
            echo "### benchstat: ${{ inputs.baseline_ref }} → ${{ github.sha }}"
            echo '```'
            "$(go env GOPATH)/bin/benchstat" bench-baseline.txt bench-current.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results
        if: always()
        run: |
          {
            echo "### Benchmarks (benchtime=$BENCHTIME, count=$BENCHCOUNT)"
            echo '```'
            grep -E '^(Benchmark|goos|goarch|pkg|cpu)' bench-current.txt || echo 'no benchmark output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-parser-bench-${{ github.run_id }}
          path: |
            bench-current.txt
            bench-baseline.txt
          if-no-files-found: warn
          retention-days: 90
