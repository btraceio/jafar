name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish/update (e.g., 0.9.0)'
        required: true
        type: string
      publish_backends_only:
        description: 'Publish only backend artifacts (jfr-shell-jdk, jfr-shell-jafar, llm-anthropic)'
        required: false
        type: boolean
        default: false
      update_catalog_only:
        description: 'Update JBang catalog only (no publishing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # Extract version from tag or manual input
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.tag }}
      is_manual: ${{ steps.version.outputs.is_manual }}
      publish_backends_only: ${{ steps.version.outputs.publish_backends_only }}
      update_catalog_only: ${{ steps.version.outputs.update_catalog_only }}
    steps:
      - name: Extract version
        id: version
        env:
          # Manual-input versions are user-supplied; keep them out of the script
          # text and validate the format before they are echoed anywhere
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PLANE: ${{ github.event.inputs.plane }}
          PUBLISH_BACKENDS_ONLY_INPUT: ${{ github.event.inputs.publish_backends_only }}
          UPDATE_CATALOG_ONLY_INPUT: ${{ github.event.inputs.update_catalog_only }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - use input version and plane
            VERSION="$INPUT_VERSION"
            if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "ERROR: version input '$VERSION' is not X.Y.Z"; exit 1
            fi
            case "$INPUT_PLANE" in
              ''|shell) PLANE="shell"; TAG="v${VERSION}" ;;
              core|mcp|llm-anthropic|llm-openai) PLANE="$INPUT_PLANE"; TAG="${PLANE}/v${VERSION}" ;;
              *) echo "ERROR: unknown plane input '$INPUT_PLANE' (shell, core, mcp, llm-anthropic, llm-openai)"; exit 1 ;;
            esac
            IS_MANUAL="true"
            PUBLISH_BACKENDS_ONLY="$PUBLISH_BACKENDS_ONLY_INPUT"
            UPDATE_CATALOG_ONLY="$UPDATE_CATALOG_ONLY_INPUT"

            if [ "$PUBLISH_BACKENDS_ONLY" = "true" ]; then
              echo "Manual backend artifacts publishing for version: $VERSION"
            elif [ "$UPDATE_CATALOG_ONLY" = "true" ]; then
              echo "Manual catalog update for version: $VERSION"
            else
              echo "Manual workflow trigger for version: $VERSION"
            fi
          else
            # Tag trigger - the tag names its plane: bare vX.Y.Z = shell (the
            # original project-wide line), <plane>/vX.Y.Z = everything else
            TAG="${{ github.ref_name }}"
            case "$TAG" in
              v[0-9]*) PLANE="shell" ;;
              core/v[0-9]*) PLANE="core" ;;
              mcp/v[0-9]*) PLANE="mcp" ;;
              llm-anthropic/v[0-9]*) PLANE="llm-anthropic" ;;
              llm-openai/v[0-9]*) PLANE="llm-openai" ;;
              *) echo "ERROR: tag '$TAG' is not a release tag (vX.Y.Z or <plane>/vX.Y.Z with plane core, mcp, llm-anthropic, llm-openai)"; exit 1 ;;
            esac
            VERSION="${TAG##*/v}"
            IS_MANUAL="false"
            PUBLISH_BACKENDS_ONLY="false"
            UPDATE_CATALOG_ONLY="false"
            echo "Release plane $PLANE, version $VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "plane=$PLANE" >> $GITHUB_OUTPUT
          echo "is_manual=$IS_MANUAL" >> $GITHUB_OUTPUT
          echo "publish_backends_only=$PUBLISH_BACKENDS_ONLY" >> $GITHUB_OUTPUT
          echo "update_catalog_only=$UPDATE_CATALOG_ONLY" >> $GITHUB_OUTPUT

  # Publish core artifacts to Sonatype
  publish-maven:
    needs: prepare
    if: needs.prepare.outputs.is_manual == 'false'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the project version is derived from git tags
          # by gradle/version-from-tag.gradle
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify tag-derived version
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          # Same per-plane rule as gradle/version-from-tag.gradle —
          # scripts/derive-version.sh --plane is its shell mirror
          DERIVED=$(scripts/derive-version.sh --plane "${{ needs.prepare.outputs.plane }}")
          case "$DERIVED" in
            *[!0-9.]*) echo "ERROR: derived version '$DERIVED' is not a plain X.Y.Z release version"; exit 1 ;;
          esac
          if [ "$DERIVED" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: git-derived version ($DERIVED) does not match tag version ($EXPECTED_VERSION)"
            exit 1
          fi
          echo "Version $DERIVED derived from tag $EXPECTED_TAG"

      - name: Point bundled plugin catalog at this release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The released jfr-shell jar bundles jfr-shell-plugins.json as an
          # offline fallback (PluginRegistry normally fetches it from main at
          # runtime). The tag commit still holds the previous release's catalog;
          # update the working tree so the jar built here bundles this release's
          # version. The tag itself is not rewritten, so a checkout of the tag
          # will NOT reproduce this one bundled file — the diff is recorded in
          # the step summary below for auditability.
          jq --arg ver "$RELEASE_VERSION" '.plugins[].latestVersion = $ver' jfr-shell-plugins.json > tmp.json && mv tmp.json jfr-shell-plugins.json
          cat jfr-shell-plugins.json
          echo "### Bundled plugin catalog deviation from tag ${GITHUB_REF_NAME:-}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff -- jfr-shell-plugins.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish parser to Maven Local (for gradle plugin dependency)
        if: needs.prepare.outputs.plane == 'core'
        run: |
          ./gradlew :parser-core:publishToMavenLocal :parser-codegen:publishToMavenLocal :parser:publishToMavenLocal --no-daemon --stacktrace

      # Each plane publishes only its own artifacts: a tag re-ships what changed in
      # that tag, not every artifact at the repo's root version (the split releases
      # are the point; see RELEASING.md "Version planes")
      - name: Publish shell plane to Maven Central
        if: needs.prepare.outputs.plane == 'shell'
        run: |
          ./gradlew :jfr-shell:shadowJar :jfr-shell:publishAllPublicationsToMavenCentralRepository --no-daemon --stacktrace
          ./gradlew :jfr-shell-jdk:publishAllPublicationsToMavenCentralRepository :jfr-shell-jafar:publishAllPublicationsToMavenCentralRepository --no-daemon --stacktrace

      - name: Publish core plane to Maven Central
        if: needs.prepare.outputs.plane == 'core'
        run: |
          ./gradlew :parser:shadowJar :parser:publishAllPublicationsToMavenCentralRepository :tools:shadowJar :tools:publishAllPublicationsToMavenCentralRepository --no-daemon --stacktrace

      - name: Publish mcp plane to Maven Central
        if: needs.prepare.outputs.plane == 'mcp'
        run: |
          ./gradlew :jfr-mcp:shadowJar :jfr-mcp:publishAllPublicationsToMavenCentralRepository --no-daemon --stacktrace

      - name: Publish llm-anthropic to Maven Central
        if: needs.prepare.outputs.plane == 'llm-anthropic'
        run: |
          ./gradlew :llm-anthropic:shadowJar :llm-anthropic:publishAllPublicationsToMavenCentralRepository --no-daemon --stacktrace

      - name: Publish llm-openai to Maven Central
        if: needs.prepare.outputs.plane == 'llm-openai'
        run: |
          ./gradlew :llm-openai:publishAllPublicationsToMavenCentralRepository --no-daemon --stacktrace

      - name: Publish gradle plugin to Maven Central
        if: needs.prepare.outputs.plane == 'core'
        run: |
          cd jafar-gradle-plugin
          ./gradlew publishAllPublicationsToMavenCentralRepository --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}

  # Keep jfr-shell-plugins.json on main pointing at the released version. It is
  # fetched at runtime from main by PluginRegistry to resolve backend plugin
  # versions, so it must always hold the latest release (never a SNAPSHOT).
  # Automating it here removes the last manually edited version number.
  update-plugin-catalog:
    needs: [prepare, publish-maven]
    # The plugin catalog lists the backend and LLM plugins; the core and mcp
    # planes publish nothing in it
    if: always() && !cancelled() && needs.prepare.outputs.is_manual == 'false'
        && needs.publish-maven.result == 'success'
        && (needs.prepare.outputs.plane == 'shell' || needs.prepare.outputs.plane == 'llm-anthropic' || needs.prepare.outputs.plane == 'llm-openai')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.JBANG_CATALOG_PAT || secrets.GITHUB_TOKEN }}

      - name: Update jfr-shell-plugins.json to the released version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          CURRENT=$(jq -r '.plugins[].latestVersion' jfr-shell-plugins.json | sort -V | tail -1)
          echo "Catalog currently points at: $CURRENT"

          # The catalog must never be downgraded (e.g. a patch release of an
          # older line must not pull it back).
          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)
          if [ "$NEWEST" != "$VERSION" ]; then
            echo "Skipping update: catalog ($CURRENT) is newer than release ($VERSION)"
            exit 0
          fi

          jq --arg ver "$VERSION" '.plugins[].latestVersion = $ver' jfr-shell-plugins.json > tmp.json && mv tmp.json jfr-shell-plugins.json
          git diff

      - name: Commit and push catalog update
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add jfr-shell-plugins.json
          if git diff --cached --quiet; then
            echo "Catalog already at $RELEASE_VERSION; nothing to commit"
            exit 0
          fi
          git commit -m "Set plugin catalog to $RELEASE_VERSION"

          # Retry on non-fast-forward: something may merge to main between the
          # checkout above and this push, and a lost catalog update leaves
          # released backend plugins unresolvable until a manual fix.
          PUSHED=0
          for attempt in 1 2 3; do
            if git push origin main; then
              PUSHED=1
              break
            fi
            echo "Push rejected (attempt $attempt/3) - rebasing on origin/main and retrying"
            git fetch origin main
            git rebase origin/main || { echo "::error::Rebase onto origin/main failed; resolve manually."; exit 1; }
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::Failed to push jfr-shell-plugins.json update to main. Update it manually."
            exit 1
          fi
          echo "✅ Plugin catalog updated to $RELEASE_VERSION"

  # Publish backend plugins only (for manual emergency releases)
  publish-backends-only:
    needs: prepare
    if: needs.prepare.outputs.publish_backends_only == 'true'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version_tag }}
          # Full history and tags: the project version is derived from git tags
          # by gradle/version-from-tag.gradle
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish backend plugins to Maven Central
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "Publishing backend plugins for version $VERSION"
          ./gradlew :jfr-shell-jdk:publishAllPublicationsToMavenCentralRepository :jfr-shell-jafar:publishAllPublicationsToMavenCentralRepository :llm-anthropic:publishAllPublicationsToMavenCentralRepository --no-daemon --stacktrace
          echo "✅ Backend plugins published successfully"

  # Update JBang catalog automatically or manually
  update-jbang-catalog:
    needs: prepare
    # Run after publish-maven on tag trigger, or independently on manual trigger
    if: |
      always() && !cancelled() &&
      (needs.prepare.outputs.update_catalog_only == 'true' ||
       (needs.prepare.outputs.is_manual == 'false' && needs.publish-maven.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Maven Central availability
        id: maven-central-check
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          IS_MANUAL="${{ needs.prepare.outputs.is_manual }}"
          # Every published plane has JBang aliases pinned at a version; this job
          # updates only the current plane's aliases, keyed on the artifact their
          # script -ref resolves
          case "${{ needs.prepare.outputs.plane }}" in
            shell) ARTIFACT="jafar-shell";  ALIASES='["jafar-shell", "jfr-shell", "jafar-shell-latest", "jfr-shell-latest"]' ;;
            mcp)   ARTIFACT="jfr-mcp";      ALIASES='["jfr-mcp", "jfr-mcp-latest"]' ;;
            core)  ARTIFACT="jafar-tools";  ALIASES='["jafar-tools-latest"]' ;;
            *)     echo "The ${{ needs.prepare.outputs.plane }} plane has no JBang catalog aliases; nothing to update"
                   exit 0 ;;
          esac
          ARTIFACT_URL="https://repo1.maven.org/maven2/io/btrace/${ARTIFACT}/${VERSION}/${ARTIFACT}-${VERSION}.pom"

          if [ "$IS_MANUAL" = "true" ]; then
            echo "🔧 Manual catalog update mode"
            echo "📦 Checking if version $VERSION is available on Maven Central..."
            MAX_ATTEMPTS=5
            SLEEP_TIME=5
          else
            echo "🤖 Automatic release mode"
            echo "⏳ Waiting for Maven Central sync to complete..."
            MAX_ATTEMPTS=20
            SLEEP_TIME=30
          fi

          ATTEMPT=1
          AVAILABLE=false

          echo "🔍 Checking Maven Central for ${ARTIFACT}:${VERSION}"
          echo "URL: $ARTIFACT_URL"

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$ARTIFACT_URL")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Artifact available on Maven Central!"
              AVAILABLE=true
              break
            fi

            echo "⏳ Not available yet (HTTP $HTTP_CODE). Waiting..."

            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              # Exponential backoff for automatic mode
              if [ "$IS_MANUAL" = "false" ] && [ $ATTEMPT -ge 10 ]; then
                SLEEP_TIME=60
              fi
              sleep $SLEEP_TIME
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$AVAILABLE" = "true" ]; then
            echo "maven-central-available=true" >> $GITHUB_OUTPUT
            echo "✅ Maven Central sync complete - will update JBang catalog now"
          else
            echo "maven-central-available=false" >> $GITHUB_OUTPUT
            if [ "$IS_MANUAL" = "true" ]; then
              echo "❌ Version $VERSION not found on Maven Central"
              echo "Please verify the version exists before retrying"
              exit 1
            else
              echo "⚠️ Maven Central sync still pending after 10 minutes"
              echo "📅 Scheduled workflow will retry every 30 minutes"
            fi
          fi

      - name: Checkout jbang-catalog
        if: steps.maven-central-check.outputs.maven-central-available == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: btraceio/jbang-catalog
          token: ${{ secrets.JBANG_CATALOG_PAT || secrets.GITHUB_TOKEN }}
          path: catalog

      - name: Update catalog files
        if: steps.maven-central-check.outputs.maven-central-available == 'true'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.version_tag }}"

          # The JBang -latest wrappers track the current main-branch development
          # version, which under tag-derived versioning is always the latest
          # release tag + -SNAPSHOT (gradle/version-from-tag.gradle derives the
          # same version for main builds).
          NEXT_SNAPSHOT="${VERSION}-SNAPSHOT"
          echo "Released: $VERSION, latest wrappers track: $NEXT_SNAPSHOT"

          cd catalog

          # A plane's release moves only that plane's aliases; -latest wrappers
          # track this plane's new dev version (the newest plane tag + -SNAPSHOT,
          # what main derives under tag-based versioning)
          case "${{ needs.prepare.outputs.plane }}" in
            shell)
              jq --arg ver "$VERSION" '.aliases["jafar-shell"]["script-ref"] = "io.btrace:jafar-shell:\($ver)"' jbang-catalog.json > tmp.json && mv tmp.json jbang-catalog.json
              sed -i.bak "s|//DEPS io.btrace:jafar-shell:.*|//DEPS io.btrace:jafar-shell:$VERSION|g" jafar-shell.java
              sed -i.bak "s|//DEPS io.btrace:jafar-shell:.*|//DEPS io.btrace:jafar-shell:$NEXT_SNAPSHOT|g" jafar-shell-latest.java
              ;;
            mcp)
              jq --arg ver "$VERSION" '.aliases["jfr-mcp"]["script-ref"] = "io.btrace:jfr-mcp:\($ver)"' jbang-catalog.json > tmp.json && mv tmp.json jbang-catalog.json
              sed -i.bak "s|//DEPS io.btrace:jfr-mcp:.*|//DEPS io.btrace:jfr-mcp:$NEXT_SNAPSHOT|g" jfr-mcp-latest.java
              ;;
            core)
              sed -i.bak "s|//DEPS io.btrace:jafar-tools:.*|//DEPS io.btrace:jafar-tools:$NEXT_SNAPSHOT|g" jafar-tools-latest.java
              ;;
          esac

          # Clean up backup files
          rm -f *.bak

          # Show changes
          git diff

      - name: Commit and push catalog updates
        if: steps.maven-central-check.outputs.maven-central-available == 'true'
        continue-on-error: true
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          if [ ! -d catalog ]; then
            echo "⚠️ Catalog checkout failed - skipping update"
            echo "Add JBANG_CATALOG_PAT secret to enable automatic catalog updates"
            exit 0
          fi

          cd catalog

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all modified catalog files
          git add jbang-catalog.json jafar-shell.java jafar-shell-latest.java jfr-mcp-latest.java jafar-tools-latest.java

          if git commit -m "Release $VERSION; bump snapshots to next version"; then
            git push || echo "⚠️ Push failed - update catalog manually at https://github.com/btraceio/jbang-catalog"
          fi

      - name: Note pending Maven Central sync
        if: steps.maven-central-check.outputs.maven-central-available == 'false' && needs.prepare.outputs.is_manual == 'false'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "⚠️ Maven Central sync still pending after 10 minutes"
          echo "📅 The sync-jbang-catalog workflow will automatically check every 30 minutes"
          echo "📦 Once artifact is available, JBang catalog will be updated automatically"
          echo ""
          echo "Version: $VERSION"
          echo "Artifact URL: https://repo1.maven.org/maven2/io/btrace/jafar-shell/$VERSION/jafar-shell-${VERSION}.pom"

  # Create GitHub Release with notes
  create-release:
    needs: [prepare, publish-maven]
    if: always() && !cancelled() && needs.prepare.outputs.is_manual == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Extract the changelog section for this release: the header carries the
          # release tag (vX.Y.Z for the shell plane, <plane>/vX.Y.Z for the rest).
          # Fall back to the bare version header, the pre-split changelog layout.
          TAG="${{ needs.prepare.outputs.version_tag }}"
          awk -v tag="$TAG" -v ver="$VERSION" '
            section == 0 && /^## \[/ {
              h = $0
              sub(/^## \[/, "", h)
              sub(/\].*$/, "", h)
              # the header carries the release tag (vX.Y.Z for the shell plane,
              # <plane>/vX.Y.Z for the rest); the bare version matches the
              # pre-split changelog layout
              if (h == tag || h == ver) {
                section = 1
              }
            }
            section == 1 { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          # If empty, use a default message
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release $VERSION" > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.version_tag }}
          name: Release ${{ needs.prepare.outputs.version }}
          body_path: /tmp/release-notes.md
          # No asset attachment: the publishing channel is Maven Central and the
          # jars live there; this checkout builds nothing, so there is nothing to
          # attach (the dead files: glob used to silently match nothing)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release comment
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.prepare.outputs.version }}';
            const tag = '${{ needs.prepare.outputs.version_tag }}';

            const body = `## 🎉 Release ${version} Published Successfully

            This release has been published to:
            - ✅ Maven Central (Sonatype): \`io.btrace:jafar-parser:${version}\`, \`io.btrace:jafar-tools:${version}\`, \`io.btrace:jafar-shell:${version}\`, \`io.btrace:jfr-mcp:${version}\`, \`io.btrace:jafar-gradle-plugin:${version}\`
            - ✅ Maven Central - Backend Plugins: \`io.btrace:jfr-shell-jdk:${version}\`, \`io.btrace:jfr-shell-jafar:${version}\`
            - ✅ JBang Catalog: Updated to ${version}

            ### Usage

            **Via JBang (recommended):**
            \`\`\`bash
            # Using catalog (always latest)
            jbang jfr-shell@btraceio recording.jfr

            # Version pinned (from Maven Central)
            jbang io.btrace:jafar-shell:${version} recording.jfr

            # Install as command
            jbang app install jfr-shell@btraceio
            jfr-shell recording.jfr
            \`\`\`

            **Via Maven/Gradle:**
            \`\`\`xml
            <!-- Parser -->
            <dependency>
              <groupId>io.btrace</groupId>
              <artifactId>jafar-parser</artifactId>
              <version>${version}</version>
            </dependency>

            <!-- JFR Shell -->
            <dependency>
              <groupId>io.btrace</groupId>
              <artifactId>jafar-shell</artifactId>
              <version>${version}</version>
            </dependency>

            <!-- JFR MCP Server -->
            <dependency>
              <groupId>io.btrace</groupId>
              <artifactId>jfr-mcp</artifactId>
              <version>${version}</version>
            </dependency>
            \`\`\`

            **Gradle Plugin:**
            \`\`\`gradle
            plugins {
              id 'io.btrace.jafar-gradle-plugin' version '${version}'
            }
            \`\`\`

            **Backend Plugins (for JFR Shell):**
            \`\`\`bash
            # Install JDK backend plugin
            java -jar jfr-shell.jar --install-plugin io.btrace:jfr-shell-jdk:${version}

            # Install Jafar backend plugin
            java -jar jfr-shell.jar --install-plugin io.btrace:jfr-shell-jafar:${version}

            # Use specific backend
            java -jar jfr-shell.jar --backend jdk recording.jfr
            \`\`\`

            ### Links
            - 📦 [Maven Central](https://central.sonatype.com/artifact/io.btrace/jafar-parser/${version})
            - 📚 [Documentation](https://github.com/btraceio/jafar#readme)
            - 🔖 [Changelog](https://github.com/btraceio/jafar/blob/${tag}/CHANGELOG.md)`;

            // Find the release and add a comment
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const release = releases.data.find(r => r.tag_name === tag);
            if (release) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body: release.body + '\n\n' + body
              });
            }

  # Tag the Go module.
  #
  # A Go module living in a subdirectory is versioned by tags prefixed with that
  # directory: consumers ask for github.com/btraceio/jafar/go-parser@vX.Y.Z, and
  # the go command looks for the tag go-parser/vX.Y.Z. The plain vX.Y.Z tag that
  # releases the Java artifacts is read as a version of the repository root
  # instead, which does not contain the package - so without this job
  # `go get github.com/btraceio/jafar/go-parser@vX.Y.Z` fails with "module
  # github.com/btraceio/jafar@vX.Y.Z found, but does not contain package".
  #
  # The Go module therefore tracks the same version as the Java artifacts, and
  # the parity rule in AGENTS.md is what makes that meaningful: the two untyped
  # parsers are kept in step, so a shared version number is not a fiction.
  tag-go-module:
    name: Tag Go module
    needs: [prepare, publish-maven]
    # The Go module versions with the parser (core plane), not with every plane
    if: needs.prepare.outputs.is_manual == 'false' && needs.prepare.outputs.plane == 'core'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version_tag }}
          fetch-depth: 0

      - name: Check the module is present in this release
        id: presence
        run: |
          if [ -f go-parser/go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No go-parser/go.mod at ${{ needs.prepare.outputs.version_tag }}; nothing to tag." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # A module version is immutable once the Go proxy has served it: a broken
      # tag cannot be corrected, only abandoned. Everything below therefore
      # checks before it tags.
      - name: Check the major version against the module path
        if: steps.presence.outputs.present == 'true'
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          major="${version%%.*}"
          module_path=$(awk '/^module /{print $2; exit}' go-parser/go.mod)
          echo "module path: $module_path"
          echo "major version: $major"

          if [ "$major" -ge 2 ]; then
            # From v2 on, Go requires the major version in the module path
            # itself. Tagging go-parser/v2.0.0 against a path with no /v2
            # suffix produces a version the proxy rejects.
            case "$module_path" in
              */v"$major")
                echo "Module path carries the /v$major suffix." ;;
              *)
                echo "::error::Release v$version needs the module path to end in /v$major."
                echo "Update go-parser/go.mod to 'module ${module_path}/v$major', update every"
                echo "import of it, and re-run. See https://go.dev/ref/mod#major-version-suffixes"
                exit 1 ;;
            esac
          fi

      - name: Set up Go
        if: steps.presence.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # Tagging a module that does not build would publish a permanently broken
      # version, so prove it works on the exact commit being tagged.
      - name: Validate the module at the released commit
        if: steps.presence.outputs.present == 'true'
        working-directory: go-parser
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)" || { echo "::error::go-parser is not gofmt-formatted"; gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - name: Create and push the module tag
        if: steps.presence.outputs.present == 'true'
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          release_tag='${{ needs.prepare.outputs.version_tag }}'
          go_tag="go-parser/v${version}"

          if git rev-parse -q --verify "refs/tags/${go_tag}" >/dev/null; then
            echo "Tag ${go_tag} already exists; nothing to do."
            echo "Go module tag \`${go_tag}\` already existed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Tag the same commit the Java release tag points at.
          git tag -a "${go_tag}" "${release_tag}^{commit}" \
            -m "Go module github.com/btraceio/jafar/go-parser v${version}"
          git push origin "${go_tag}"

      # Best effort: asking the proxy for the version makes it fetch and index
      # the module, so pkg.go.dev shows the release without waiting for someone
      # to be the first to depend on it.
      - name: Warm the module proxy
        if: steps.presence.outputs.present == 'true'
        continue-on-error: true
        run: |
          version='${{ needs.prepare.outputs.version }}'
          cd "$(mktemp -d)"
          go mod init warm >/dev/null
          GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod \
            go list -m "github.com/btraceio/jafar/go-parser@v${version}"

      - name: Summary
        if: steps.presence.outputs.present == 'true'
        run: |
          version='${{ needs.prepare.outputs.version }}'
          {
            echo "### Go module"
            echo ""
            echo "Version \`v${version}\` is tagged as \`go-parser/v${version}\`. Consumers depend on it as:"
            echo ""
            echo '```'
            echo "go get github.com/btraceio/jafar/go-parser@v${version}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
