# ArchUnit freeze configuration for the architecture rules (ArchitectureRulesTest,
# ArchitectureRules in io.jafar.arch).
#
# NO RUN CAN ADD VIOLATIONS TO THE STORE: the violation store (archunit_store/, generated by
# ArchUnit via `./gradlew :arch-tests:test -ParchFreeze` and never hand-edited) is committed and
# shrink-only. Store creation and refreezing are permanently off here; they are switched on only
# by that explicit -ParchFreeze run, which passes
# archunit.freeze.store.default.allowStoreCreation=true and archunit.freeze.refreeze=true as
# system properties. ArchUnit honours `archunit.`-prefixed system properties over this file
# (verified against ArchUnit 1.5.1), so this file stays authoritative — and shrink-only — for
# every normal run, including CI.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.refreeze=false
