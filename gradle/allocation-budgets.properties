# Allocation budgets (bytes) — the ratchet file of the allocation gate.
#
# Format (see io.jafar.testsupport.AllocationBudgets):
#   <module>.<entry>.<fixture>.jdk<major>=<bytes>
#   <key>.tolerance=<bytes>          (optional, default 0)
#   <key>=excluded: <reason>         (skips the cell instead of comparing)
#
# Rules:
#   - Raising a value (or a tolerance) requires `Alloc-Budget: <reason>` in the PR
#     body; scripts/alloc-budget-check.sh enforces it, mirroring the parity gate.
#   - Lowering a value needs no statement; a measurement more than the tolerance
#     BELOW the budget fails with "re-tighten", so a stale, loose budget cannot
#     linger (D2).
#
# How the values are measured (parser-core.untyped, T12): one parse = a fresh
# ParsingContext.create() + newUntypedParser(tck-test.jfr) + a counting handler and a
# withParserListener listener that marks the chunk-pool threads from onChunkEnd; two
# warm-up parses are discarded (the first pays ~14x the steady state in lazy init —
# kb/a4-jdk8-alloc); the measured figure is the calling-thread delta plus the pool
# threads' absolute counters (io.jafar.testsupport.AllocationMeter). The allocation
# tasks pin the JVM with -XX:ActiveProcessorCount=4 (chunk pool = 2 = the recording's
# 2 chunks) and -XX:TieredStopAtLevel=1: without the C1 pin, C2's escape analysis
# eliminates a timing-dependent share of the ~46 MB pool-thread allocation, wobbling
# the same measurement by 0.6-6% between runs; under C1 it is byte-identical (see
# parser-core/build.gradle).
#
# Sensitivity: the tolerance is far below the R5 mutation size (one extra 16-byte
# array per event = 67,657 * 16 = 1,082,512 bytes, caught with ~500x margin); a
# regression smaller than the tolerance would slip through — that is the recorded
# sensitivity floor of this gate.
#
# Measurements (3 consecutive `--rerun` runs per build, callingThreadOnly/pool split
# in the run logs; pool share byte-identical in every run and on every build):
#   jdk21, Eclipse Adoptium 21.0.11+10-LTS (tem):   46,384,688  46,384,688  46,384,688
#   jdk21, Azul Systems 21.0.10+7-LTS (zulu):      46,384,688  46,384,688  46,384,688
#   jdk21, BellSoft 21.0.11+11-LTS (librca):       46,384,688  46,384,688  46,384,688
#   jdk21, Oracle Graal 21.0.10+8-LTS-jvmci:       46,384,672  46,384,672  46,384,672
#     (graal is 16 bytes lower on the CALLING thread only: 83,688 vs 83,704; the pool
#      share is 46,300,984 on every jdk21 build measured)
#   jdk8,  Azul Systems 25.482-b08 (zulu 8.0.482): 47,301,072  47,301,136  47,301,072
#     (+ 47,301,072 three more times; the one +64 outlier is calling-thread only —
#      the pool share is 47,216,576 in every run)
#
# Tolerances (Q3): the smallest value covering the measured spread would be 16
# (jdk21) and 64 (jdk8); both are widened to 2048 as headroom for the JDK builds that
# could NOT be measured locally — the CI cells run Temurin patch levels we have no
# local copy of, and Temurin 8 is not installable here at all (R8: the jdk8 budget is
# unverified on Temurin; `sdk install java 8.0.512-tem` — "not available"). The four
# jdk21 builds measured differ by at most 16 bytes, so 2048 has ~100x margin over
# any build-to-build delta seen while still catching any regression >= 2 KB.

parser-core.untyped.tck-test.jfr.jdk21=46384688
parser-core.untyped.tck-test.jfr.jdk21.tolerance=2048
parser-core.untyped.tck-test.jfr.jdk8=47301072
parser-core.untyped.tck-test.jfr.jdk8.tolerance=2048

# parser-codegen.typed (T13): one parse = a fresh ParsingContext.create() + newTypedParser
# (tck-test.jfr) with a jdk.GCHeapSummary handler — the typed interface the codegen tests use —
# so the measured figure covers the runtime-generated deserializer invocation and the handler
# call, both on the chunk-pool threads. The figure is ~1.7 MB, not the untyped gate's ~46 MB:
# the typed path decodes only the registered type (1,892 GCHeapSummary events; tck-test.jfr
# delivers no jdk.ExecutionSample to any handler — pre-existing parser behaviour, out of scope,
# see the test Javadoc), while the untyped gate measures every event's map.
#
# Measurements (3 consecutive `--rerun` runs per build, verified by the vm= audit line):
#   jdk21, Eclipse Adoptium 21.0.11+10-LTS (tem): 1,727,000 x3 (identical)
#   jdk21, Azul Systems 21.0.10+7-LTS (zulu):     1,726,648 x3 (identical; -352 vs tem)
#   jdk21, BellSoft 21.0.11+11-LTS (librca):      1,727,000 x3 (identical)
#   jdk21, Oracle Graal 21.0.10+8-LTS-jvmci:     1,726,632 x3 (identical; -368 vs tem)
#   jdk8,  Azul Systems 25.482-b08 (zulu 8.0.482): 1,915,416 x6 (identical; only Zulu 8 is
#     installed locally — R8 as for the untyped jdk8 key: unverified on CI's Temurin 8)
#
# Tolerance (coordinator decision): the largest deviation seen anywhere in this cell is a
# +301,168-byte occasional one-off lazy-init outlier on a pool thread under Zulu, observed
# 1-of-3 runs (T13 predecessor, cross-build probe); 11 subsequent runs (8 of them clean Zulu
# runs) did not reproduce it, and the probe's own temporary per-chunk println instrumentation
# was shown to shift the steady state by -55,048 by lazily initializing print machinery on the
# fresh pool threads — the same lazy-init class as the outlier. Tolerance rounded up to 310000
# to cover that outlier; occasional one-off lazy-init outlier on a pool thread under Zulu,
# observed 1-of-3; root cause not hunted (R8). The steady-state cross-build spread is <= 368,
# so the ratchet still catches real regressions: the R5 mutation (new byte[16] per event in
# EventStreamGenerated.onEvent, which fires for every event in the recording) adds ~2.16 MB
# and fails with ~7x margin over the tolerance.
#
# Sensitivity floor: a regression confined to the 1,892 handled GCHeapSummary decodes is
# caught only above ~164 B/event (310,000 / 1,892); one on the shared per-event path
# (~135,307 calls) above ~2.3 B/event.

parser-codegen.typed.tck-test.jfr.jdk21=1727000
parser-codegen.typed.tck-test.jfr.jdk21.tolerance=310000
parser-codegen.typed.tck-test.jfr.jdk8=1915416
parser-codegen.typed.tck-test.jfr.jdk8.tolerance=310000

# hdump-parser.parse.a5-instance-fields (T14): one parse = HeapDumpParser.parse(path) with
# default options on the SyntheticHeapDumpGenerator.generateA5InstanceFields fixture (4 UTF-8
# strings + 2 load-class records + one heap-dump segment holding 2 class dumps, 3 instance dumps
# and 1 GC root; 3 objects asserted). The fixture is generated once outside the measurement — the
# file name varies with the temp dir, the bytes do not — and two warm-up parses are discarded.
#
# Single-threadedness (why this runs in the normal `test` task with the plain calling-thread
# meter, D9): `grep -rniE "executor|new thread" hdump-parser/src/main` → no matches; the only
# parallelism in the module is DominatorTreeComputer's parallel common-pool stream chunks,
# reached solely through computeDominators(), which the default-options parse(path) does not
# call. The run log's poolThreads=0 audit line confirms it on every run.
#
# Measurements (3 consecutive `--rerun` runs per build, toolchain forced via
# -Porg.gradle.java.installations.paths=<build>,<zulu8> -Porg.gradle.java.installations.auto-detect=false
# --configure-on-demand, verified by the vm= audit line — with auto-detect off, parser-core's JDK 8
# toolchain needs zulu8 on the paths or the build fails and a stale Temurin XML gets read; the
# build cache is a second trap: org.gradle.caching=true restores another JVM's cached test result
# (the test JVM is not in the cache key), so cross-build verification needs cleanTest +
# --no-build-cache, never a bare --rerun):
#   jdk21, Eclipse Adoptium 21.0.11+10-LTS (tem):    6,944 x4 (identical)
#   jdk21, Azul Systems 21.0.10+7-LTS (zulu):        6,944 x3 (identical)
#   jdk21, BellSoft 21.0.11+11-LTS (librca):        6,944 x3 (identical)
#   jdk21, Oracle Graal 21.0.10+8-LTS-jvmci:        6,928 x3 and 7,216 x3 — bimodal on Graal
#     (the +272-over-reference variant appears about half the runs; root cause not hunted, R8).
#     Both modes sit within the tolerance, so Graal runs stay green either way
#
# Tolerance: 2048, mirroring the untyped key's rationale — the steady-state cross-build spread is
# 16 bytes, but the CI cells run Temurin patch levels with no local copy, and Graal's high mode
# reaches +272 over the reference build; 2048 covers both with margin. Sensitivity floor: the A5
# fixture has only 7 top-level records, so a 16-byte-per-record regression (224 bytes total)
# would slip under the tolerance — the recorded R5 mutation therefore uses one 512-byte array per
# record (+3,696), which fails with margin.
hdump-parser.parse.a5-instance-fields.jdk21=6944
hdump-parser.parse.a5-instance-fields.jdk21.tolerance=2048
hdump-parser.parse.a5-instance-fields.jdk8=excluded: module targets Java 21; never runs on JDK 8

# pprof-parser.parse.minimal (T14): one parse = PprofParser.parse(path) on the MinimalPprofBuilder
# basic profile of PprofParserTest#roundTripBasicProfile (1 sample type cpu/nanoseconds, 1
# function, 1 location, 1 labeled sample, 7 string-table entries, 5 s duration; payload asserted
# every parse). The fixture is built once outside the measurement — the file name varies, the
# profile bytes do not — and two warm-up parses are discarded.
#
# Single-threadedness (normal `test` task, calling-thread meter, D9): PprofReader is a
# single-phase hand-rolled decoder; `grep -rniE "executor|new thread|parallel|forkjoin"
# pprof-parser/src/main` → no matches. The run log's poolThreads=0 audit line confirms it.
#
# Measurements (3 consecutive `--rerun` runs per build, same toolchain forcing as the hdump key):
#   jdk21, Eclipse Adoptium 21.0.11+10-LTS (tem):   73,296 x4 (identical)
#   jdk21, Azul Systems 21.0.10+7-LTS (zulu):      73,296 x3 (identical)
#   jdk21, BellSoft 21.0.11+11-LTS (librca):       73,296 x3 (identical)
#   jdk21, Oracle Graal 21.0.10+8-LTS-jvmci:       71,112 x3 (identical; -2,184 vs tem — Graal's
#     JIT eliminates a fixed share of the decode-path allocations; the delta is build-stable)
#
# Tolerance: 4096 — the smallest value covering the measured cross-build spread is 2,184 (Graal
# vs the Temurin reference); it is rounded up to 4096 for the unmeasured CI Temurin patch levels
# (same headroom argument as the untyped key's 2048, scaled to this key's ~2 KB spread).
# Sensitivity floor: the profile has only ~12 top-level fields, so a 16-byte-per-field regression
# (~380 bytes) would slip under the tolerance — the recorded R5 mutation therefore uses one
# 512-byte array per field (+~5,800), which fails with margin.
pprof-parser.parse.minimal.jdk21=73296
pprof-parser.parse.minimal.jdk21.tolerance=4096
pprof-parser.parse.minimal.jdk8=excluded: module targets Java 21; never runs on JDK 8

# otlp-parser.parse.minimal (T15): one parse = OtlpParser.parse(path) on the MinimalOtlpBuilder
# basic profile of OtlpParserTest#roundTripBasicProfile (sample type cpu/nanoseconds, 1 function,
# 1 location with line 42, 1 stack, 1 thread attribute, 1 sample; payload asserted every parse).
# The fixture is built once outside the measurement — the file name varies, the profile bytes do
# not — and two warm-up parses are discarded.
#
# Single-threadedness (normal `test` task, calling-thread meter, D9): OtlpReader is a
# single-phase hand-rolled protobuf wire-format decoder; `grep -rniE "executor|new
# thread|parallel|forkjoin" otlp-parser/src/main` → no matches. The run log's poolThreads=0
# audit line confirms it on every run.
#
# Measurements (3 consecutive runs per build, same toolchain forcing as the hdump/pprof keys):
#   jdk21, Eclipse Adoptium 21.0.11+10-LTS (tem):   3,720 x3 (identical)
#   jdk21, Azul Systems 21.0.10+7-LTS (zulu):      3,720 x3 (identical)
#   jdk21, BellSoft 21.0.11+11-LTS (librca):       3,720 x3 (identical)
#   jdk21, Oracle Graal 21.0.10+8-LTS-jvmci:      3,720 x3 (identical)
#
# Tolerance: 2048, mirroring the hdump key's rationale — the measured cross-build spread is 0,
# but the CI cells run Temurin patch levels with no local copy, so headroom is kept for them
# (same argument as the untyped key's 2048). Sensitivity floor: the minimal profile decodes
# only ~32 fields, so a 16-byte-per-field regression (~512 bytes) would slip under the
# tolerance — the recorded R5 mutation therefore uses one 512-byte array per field
# (+16,368; measured 20,088), which fails "over budget by 14,320" with ~8x margin over the
# tolerance.
otlp-parser.parse.minimal.jdk21=3720
otlp-parser.parse.minimal.jdk21.tolerance=2048
otlp-parser.parse.minimal.jdk8=excluded: module targets Java 21; never runs on JDK 8
