parser-core.untyped-filtered.tck-test.jfr.chunks.started=2
parser-core.untyped-filtered.tck-test.jfr.chunks.read=2
parser-core.untyped-filtered.tck-test.jfr.events.read=67657
parser-core.untyped-filtered.tck-test.jfr.events.decoded=1892
parser-core.untyped-filtered.tck-test.jfr.varints.read=333709
parser-core.untyped-filtered.tck-test.jfr.values.skipped=8466
parser-core.untyped-filtered.tck-test.jfr.constants.indexed=8466
parser-core.untyped-filtered.tck-test.jfr.constants.decoded=0

