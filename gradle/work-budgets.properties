# Work budgets (counts) — the ratchet file of the work-budget gate (doc/plans/work-budgets.md).
#
# Format (see io.jafar.testsupport.work.WorkBudgets):
#   <module>.<entry>.<fixture>.<counter>=<count>
# A counter is always two words (events.decoded), so a key splits into its entry point (everything
# before the last two words) and its counter. The counters and the parser methods behind them are
# listed once, in io.jafar.testsupport.work.WorkProbes:
#   chunks.started     chunks the chunk parser started
#   chunks.read        chunks whose constant pools and events were read (not skipped by time range)
#   events.read        event records handed to the parser listener
#   events.decoded     events whose payload was decoded into a value
#   varints.read       RecordingStream.readVarint calls, anywhere in a chunk
#   values.skipped     TypeSkipper skips: fields, and constant-pool entries while indexing
#   constants.indexed  constant-pool entries located while the checkpoints are read
#   constants.decoded  constant-pool entries decoded into a value (lazily)
# chunks.skipped (= started - read) and events.skipped (= read - decoded) are printed by every run,
# not budgeted.
#
# Rules:
#   - Counts are exact: no tolerance. They depend on the parser's code and the fixture only — not
#     on time, the JIT, the JDK, or the chunk pool's size (evidence below).
#   - A count above its budget fails. A count below it fails too, with "re-tighten: set <key>=<n>",
#     so this file always holds the current counts.
#   - Raising a value, or adding a key with a nonzero value to an entry point that already has
#     keys, requires `Work-Budget: <reason>` in the PR body; scripts/work-budget-check.sh enforces
#     it. Lowering a value, or adding a new entry point, needs no statement.
#   - Regenerate from a measurement: ./gradlew :parser-core:workTest :parser-codegen:workTest
#     -Pjafar.work.update --rerun (rewrites these lines in place; review the diff).
#
# How a cell is measured: the work tests (io.jafar.parser.work.* in parser-core and
# parser-codegen) run in the workTest tasks, whose JVM carries the work-budget agent
# (-javaagent:test-support/build/work-agent/jafar-work-agent-*.jar). One cell parses its fixture
# three times on a fresh ParsingContext each; the three counts must be identical, then the third
# is compared with the lines below. Every run prints a `work <entry> runs=[...]` audit line with
# the processor count and the VM, and one `work <key> measured=<n> budget=<b>` line per counter.
#
# Determinism (all eight cells, identical audit lines in every run):
#   - 5 consecutive `--rerun` runs of both workTest tasks, Ubuntu 21.0.12.1+1, 4 processors;
#   - -Pjafar.activeProcessorCount=1 and =16 (chunk pool 1 and 14 threads);
#   - Eclipse Adoptium 25.0.5+8-LTS (both tasks pointed at a JDK 25 launcher for the run).
# Each run is itself three parses compared in-JVM, so every cell was counted 24 times.

# parser-core.untyped: ParsingContext.create() + newUntypedParser(tck-test.jfr) with one counting
# handler, read with the generic reader (EventStream). Every one of the 67,657 events is decoded.
# The 26 constant-pool entries decoded are all in the first chunk (the time-range cell below, which
# reads only the second chunk, decodes none).
parser-core.untyped.tck-test.jfr.chunks.started=2
parser-core.untyped.tck-test.jfr.chunks.read=2
parser-core.untyped.tck-test.jfr.events.read=67657
parser-core.untyped.tck-test.jfr.events.decoded=67657
parser-core.untyped.tck-test.jfr.varints.read=811261
parser-core.untyped.tck-test.jfr.values.skipped=8466
parser-core.untyped.tck-test.jfr.constants.indexed=8466
parser-core.untyped.tck-test.jfr.constants.decoded=26

# parser-core.untyped-filtered: the same parse with the handler registered through
