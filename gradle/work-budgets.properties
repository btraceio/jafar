# parser-core.untyped-headers on the generated test-ap.jfr (8,325 events, one chunk): a header
# handler that uses start times for every type. Each header skips the two fields before startTime
# (stackTrace, eventThread) and reads it: values.skipped = 8,325 * 2 + the 445 indexed entries.
# test-ap.jfr's bytes vary with the generating JDK build (constant pools in another order,
# test-recordings/README.md); the counts do not depend on that order.
parser-core.untyped-headers.test-ap.jfr.chunks.started=1
parser-core.untyped-headers.test-ap.jfr.chunks.read=1
parser-core.untyped-headers.test-ap.jfr.events.read=8325
