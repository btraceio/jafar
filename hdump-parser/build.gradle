plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish'
}

// Per-plane tag-derived version (see gradle/version-from-tag.gradle)
apply from: rootProject.file('gradle/version-from-tag.gradle')

// SyntheticHeapDumpGenerator is a build-time fixture, never a published parser capability.
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

def libraryName = "hdump-parser"
def component_version = project.hasProperty("jafar_version") ? project.jafar_version : project.version

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    jmh {
        java {
            srcDirs = ["src/jmh/java"]
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    jmhImplementation {
        extendsFrom configurations.implementation
    }
}

dependencies {
    // Core parsing utilities (shared with jfr-parser)
    api project(':parser-core')

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.5'

    // Fast primitive collections (same as parser module)
    implementation 'it.unimi.dsi:fastutil-core:8.5.12'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'org.slf4j:slf4j-simple:2.0.5'
    // Allocation meter + budgets (test-support); the parse is single-threaded, so the budget
    // test runs in the normal `test` task (D9) — no dedicated allocationTest task here.
    testImplementation project(':test-support')

    jmhImplementation project(':parser-core')
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

// JMH benchmarks (operators: parse, dominator tree, retained sizes, path to GC root).
// ./gradlew :hdump-parser:jmh -PjmhArgs="-rf json -rff build/jmh/hdump-parser.json <regex>"
// Fixtures (real JVM heap dumps) are generated on first use into hdump-parser/build/jmh-fixtures.
// Keep the benchmarks compiling: `check` (and so `build`) compiles them without running them.
tasks.named('check') { dependsOn compileJmhJava }

tasks.register('jmh', JavaExec) {
    description = 'Runs JMH benchmarks'
    group = 'verification'
    dependsOn compileJmhJava
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass.set('org.openjdk.jmh.Main')
    workingDir = rootProject.projectDir
    systemProperty 'hdump.bench.fixtures', layout.buildDirectory.dir('jmh-fixtures').get().asFile.absolutePath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }

    if (project.hasProperty('jmhArgs')) {
        setArgs(Arrays.asList(project.jmhArgs.split(' ')))
    }
}

def allocationBudgetsFile = rootProject.file('gradle/allocation-budgets.properties')

test {
    useJUnitPlatform()
    // Heap dumps can be large - allow more memory for tests
    maxHeapSize = '2g'
    // Allocation budget gate (T14): the budgets file is a task input, so a budget change re-runs
    // the gate; the fixture is generated by the test, so there is no fixture file to declare.
    systemProperty 'jafar.alloc.budgets', allocationBudgetsFile.absolutePath
    inputs.file allocationBudgetsFile
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

group = 'io.btrace'
version = component_version
description = 'Fast HPROF heap dump parser with minimal API'

mavenPublishing {
    coordinates('io.btrace', 'jafar-hdump-parser', version.toString())
}
