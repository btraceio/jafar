plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish'
}

// Per-plane tag-derived version (see gradle/version-from-tag.gradle)
apply from: rootProject.file('gradle/version-from-tag.gradle')

// SyntheticHeapDumpGenerator is a build-time fixture, never a published parser capability.
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

def libraryName = "hdump-parser"
def component_version = project.hasProperty("jafar_version") ? project.jafar_version : project.version

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Core parsing utilities (shared with jfr-parser)
    api project(':parser-core')

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.5'

    // Fast primitive collections (same as parser module)
    implementation 'it.unimi.dsi:fastutil-core:8.5.12'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'org.slf4j:slf4j-simple:2.0.5'
}

test {
    useJUnitPlatform()
    // Heap dumps can be large - allow more memory for tests
    maxHeapSize = '2g'
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

group = 'io.btrace'
version = component_version
description = 'Fast HPROF heap dump parser with minimal API'

mavenPublishing {
    coordinates('io.btrace', 'jafar-hdump-parser', version.toString())
}
