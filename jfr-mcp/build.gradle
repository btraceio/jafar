plugins {
    id 'java'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.0.0'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish'
}

// The shared helper that records which io.btrace modules this fat jar embeds in its manifest
apply from: rootProject.file('gradle/embedded-modules.gradle')

def libraryName = "jfr-mcp"
def component_version = project.hasProperty("jafar_version") ? project.jafar_version : rootProject.version

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Official MCP Java SDK
    implementation platform('io.modelcontextprotocol.sdk:mcp-bom:1.1.1')
    implementation 'io.modelcontextprotocol.sdk:mcp'

    // Jafar dependencies
    implementation project(':shell-core')
    implementation project(':parser')
    implementation project(':hdump-shell')
    testImplementation(testFixtures(project(':hdump-parser')))
    implementation project(':pprof-parser')
    implementation project(':pprof-shell')
    testImplementation(testFixtures(project(':pprof-parser')))
    implementation project(':otlp-shell')
    testImplementation(testFixtures(project(':otlp-parser')))

    // Backend plugins (discovered via ServiceLoader)
    runtimeOnly project(':jfr-shell-jafar')

    // Embedded Jetty for HTTP transport
    implementation 'org.eclipse.jetty:jetty-server:12.0.16'
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.0.16'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.16'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JMC Writer API for creating test JFR files
    testImplementation 'org.openjdk.jmc:flightrecorder.writer:9.1.0'
}

test {
    useJUnitPlatform {
        excludeTags 'e2e'
    }
    // Allocate sufficient heap for tests that load real JFR files
    jvmArgs '-Xmx2g', '-Xms512m'
    // Isolate session persistence from real ~/.jafar data during tests
    systemProperty 'jafar.mcp.sessions.file', "${System.getProperty('java.io.tmpdir')}/jafar-mcp-test-sessions.json"
    // McpTransportHarness advertises -Dmcp.test.timeout.ms to raise its per-response deadline;
    // forward it so that advice actually works.
    systemProperties System.properties.subMap(['mcp.test.timeout.ms'])
    if (System.getProperty('mcp.updateSnapshot') != null) {
        systemProperty 'mcp.updateSnapshot', System.getProperty('mcp.updateSnapshot')
    }

    // Stress tests are a separate concept from integration tests; always exclude from default `test`.
    exclude '**/JafarMcpStressTest.class'

    // Exclude integration tests by default (require large JFR files)
    // Run with -DenableIntegrationTests=true to include them
    if (System.getProperty('enableIntegrationTests') != 'true') {
        exclude '**/JafarMcpServer*Test.class'
        exclude '**/HandlerLogicIntegrationTest.class'
        exclude '**/SessionRegistryTest.class'
        exclude '**/SessionRegistryClientIsolationTest.class'
    }

    // Configure Mockito as Java agent for inline mocking in Java 25
    doFirst {
        def mockitoAgent = configurations.testRuntimeClasspath.files.find { it.name.contains('mockito-core') }
        if (mockitoAgent) {
            jvmArgs "-javaagent:${mockitoAgent}"
        }
    }

    // Open Java modules for Mockito instrumentation in Java 25
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    jvmArgs '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'

    finalizedBy jacocoTestReport
}

// Integration tests task (slow, loads real JFR files)
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests that load real JFR files (slow)'
    group = 'verification'

    useJUnitPlatform {
        includeTags 'integration'
    }

    // Integration tests need more heap for processing JFR files
    jvmArgs '-Xmx4g', '-Xms512m'

    shouldRunAfter test
}

// End-to-end tests — spawn the MCP server subprocess and drive the real analysis workflow.
// Run with: ./gradlew :jfr-mcp:endToEndTest
// To test a specific JFR file:  ./gradlew :jfr-mcp:endToEndTest -Dmcp.e2e.jfr=/path/to/file.jfr
tasks.register('endToEndTest', Test) {
    description = 'Spawns the MCP server as a subprocess and drives the real tool sequence'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'e2e'
    }

    systemProperties System.properties.subMap(['mcp.e2e.jfr'])

    jvmArgs '-Xmx512m', '-Xms256m'

    doFirst {
        def mockitoAgent = configurations.testRuntimeClasspath.files.find { it.name.contains('mockito-core') }
        if (mockitoAgent) {
            jvmArgs "-javaagent:${mockitoAgent}"
        }
    }
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    jvmArgs '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'

    dependsOn shadowJar
    shouldRunAfter test
}

// Writes the MCP guidance contract JSON (tool names, descriptions, input schemas, prompts,
// resources) so out-of-repo consumers can check against the in-development server. The jafar-perf
// plugin (btraceio/agent-plugins) consumes this instead of waiting for a published release.
// Run with: ./gradlew :jfr-mcp:exportMcpContract
// The output is byte-identical to the committed src/test/resources/mcp-contract.json snapshot.
tasks.register('exportMcpContract', JavaExec) {
    description = 'Writes the MCP guidance contract JSON for out-of-repo consumers'
    group = 'verification'

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.jafar.mcp.McpContractExport'
    args = [ layout.buildDirectory.file('mcp-contract/mcp-contract.json').get().asFile.absolutePath ]

    dependsOn testClasses
    shouldRunAfter test
}

// Stress tests — exercise the full stdio pipeline under load. Exclude from default `test`.
tasks.register('stressTest', Test) {
    description = 'Runs reliability stress tests over the in-process stdio harness'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'stress'
    }

    jvmArgs '-Xmx512m', '-Xms256m'

    // Mockito agent + java.base opens (mirror the existing `test` task setup):
    doFirst {
        def mockitoAgent = configurations.testRuntimeClasspath.files.find { it.name.contains('mockito-core') }
        if (mockitoAgent) {
            jvmArgs "-javaagent:${mockitoAgent}"
        }
    }
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    jvmArgs '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'

    shouldRunAfter test
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// Exclude duplicate SLF4J provider (we use logback-classic)
configurations.runtimeClasspath {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}

// Deterministic trimmed fastutil: the embedded copy keeps only the static closure of classes the
// server's code actually references. jdeps over the runtime classpath finds every it.unimi
// reference across embed code and dependencies; walking fastutil's own reference graph from those
// entry points yields exactly the classes that can ever load. fastutil ships pure collections
// with no reflection, and the heap code invokes it through direct imports only (verified: no
// Class.forName/loadClass over fastutil), so the static closure is complete by construction, and
// it re-derives on every classpath change — a newly referenced fastutil type cannot ship missing.
def fastutilClosurePatterns() {
    def classpathFiles = configurations.runtimeClasspath.resolve()
    def coreJar = classpathFiles.find { it.name.startsWith('fastutil-core-') && it.name.endsWith('.jar') }
    if (coreJar == null) {
        throw new IllegalStateException(
            'fastutil-core expected on the runtime classpath to trim the embedded copy')
    }
    def jdepsPath = new File(System.getProperty('java.home'), 'bin/jdeps')
    def proc = new ProcessBuilder(
        [jdepsPath.path, '-verbose:class', '--multi-release', '21']
            + classpathFiles.collect { it.path })
        .redirectErrorStream(false)
        .start()
    def stdout = proc.inputStream.text
    def stderr = proc.errorStream.text
    if (proc.waitFor() != 0) {
        throw new IllegalStateException('jdeps failed while deriving the fastutil closure: ' + stderr)
    }
    def fastutilPrefix = 'it.unimi.dsi.fastutil.'
    def edges = [:]
    def entries = [] as Set
    logger.lifecycle("fastutil trim: jdeps over ${classpathFiles.size()} classpath elements")
    stdout.eachLine { line ->
        def m = line =~ /^\s*(\S+)\s+->\s+(\S+)\s+(.*)$/
        if (m.matches() && m.group(2).startsWith(fastutilPrefix)) {
            if (m.group(1).startsWith(fastutilPrefix)) {
                edges.computeIfAbsent(m.group(1), { [] as Set }).add(m.group(2))
            } else {
                entries.add(m.group(2))
            }
        }
    }
    if (entries.isEmpty()) {
        throw new IllegalStateException('No fastutil references found on the runtime classpath; refusing to trim blindly')
    }
    def keep = new HashSet(entries)
    def queue = new ArrayDeque(entries)
    while (!queue.isEmpty()) {
        def current = queue.poll()
        (edges[current] ?: []).each { next ->
            if (keep.add(next)) {
                queue.add(next)
            }
        }
    }
    // jdeps does not report superclass and superinterface references at all — a map's
    // `extends AbstractX2YMap` or its implemented interface never appear in its output, and a
    // class cannot load without them. Neither does the JVM resolve types that appear only in
    // field or method descriptors when a class file is merely inspected — those descriptors are
    // read at first use. This exactly broke hdump_open and hdump_summary at runtime with the
    // first trims (NoClassDefFoundError for AbstractLong2ObjectMap, then AbstractObjectCollection).
    // So the closure is walked by LOADING every kept class from the core jar with initialization
    // suppressed: no static state runs, and the walk closes over the hierarchy, declared fields,
    // method and constructor signatures, and nested classes of each class. Loading every kept
    // class doubles as the completeness check: a name absent from the core jar fails the build
    // here, not hdump_open at a user's terminal.
    def classLoader = new URLClassLoader([coreJar.toURI().toURL()] as URL[], null)
    try {
        def classes = new ArrayDeque(keep)
        def walked = new HashSet()
        def addFastutilType = { Class<?> t ->
            if (t != null && t.name.startsWith(fastutilPrefix) && keep.add(t.name)) {
                classes.add(t.name)
            }
        }
        while (!classes.isEmpty()) {
            def fq = classes.poll()
            def cls
            try {
                cls = Class.forName(fq, false, classLoader)
            } catch (Throwable t) {
                throw new IllegalStateException('fastutil class in the closure is not in the core jar: ' + fq, t)
            }
            if (!walked.add(fq)) {
                continue
            }
            addFastutilType(cls.superclass)
            cls.interfaces.each { t -> addFastutilType(t) }
            cls.declaredFields.each { f -> addFastutilType(f.type) }
            cls.constructors.each { c -> c.parameterTypes.each { t -> addFastutilType(t) } }
            cls.methods.each { m ->
                addFastutilType(m.returnType)
                m.parameterTypes.each { t -> addFastutilType(t) }
                m.exceptionTypes.each { t -> addFastutilType(t) }
            }
            cls.classes.each { t -> addFastutilType(t) }
        }
    } finally {
        classLoader.close()
    }
    def fileNames = keep.collect { it.replace('.', '/') + '.class' }.sort()
    def classFiles = jarFileEntries(coreJar).count { it.endsWith('.class') }
    logger.lifecycle("fastutil trim: kept ${keep.size()} of the core jar's ${classFiles} classes (${fileNames.size()} include entries)")
    return [coreJar, fileNames]
}

def jarFileEntries(File jar) {
    def list = []
    new java.util.jar.JarFile(jar).withCloseable { jf ->
        def e = jf.entries()
        while (e.hasMoreElements()) {
            def n = e.nextElement().name
            if (!n.endsWith('/')) {
                list << n
            }
        }
    }
    list
}

def fastutilTrimDir = layout.buildDirectory.dir('fastutil-trimmed')

tasks.register('trimFastutil') {
    group = 'Build'
    description = 'Trims the embedded fastutil-core copy to the jdeps-derived static closure'
    inputs.files(configurations.runtimeClasspath) // any class change re-derives the closure
    outputs.dir(fastutilTrimDir)
    doLast {
        def (coreJar, patterns) = fastutilClosurePatterns()
        project.copy {
            from zipTree(coreJar)
            include patterns
            into fastutilTrimDir
        }
    }
}

// Shadow JAR for standalone distribution
shadowJar {
    group 'Build'
    archiveBaseName = libraryName
    archiveVersion = component_version
    archiveClassifier.set('all')

    mergeServiceFiles()

    // Record which io.btrace modules and versions this fat jar embeds (see gradle/embedded-modules.gradle)
    recordEmbeddedModules(manifest)

    dependencies {
        // The shells' terminal stack does not exist inside an MCP server: the tools talk to the
        // engine classes (sessions, path evaluators, report generators), which import no jline, and
        // the CLI/UI adapters implementing ShellModule.getCompleter are never loaded here.
        exclude(dependency('org.jline:jline'))
        exclude(dependency('org.jline:jline-terminal'))
        exclude(dependency('org.jline:jline-reader'))
        // The plugin install machinery (aether resolver, HTTP transports, commons-logging) loads
        // lazily since the MCP server never installs plugins, so it can stay out of the jar.
        // The backend registry only reads the plugin directory, which needs no Maven resolver.
        exclude(dependency('org.apache.maven:.*'))
        exclude(dependency('org.apache.maven.resolver:.*'))
        exclude(dependency('org.apache.httpcomponents:.*'))
        exclude(dependency('org.apache.commons:commons-logging'))
        // The embedded fastutil-core copy is replaced by the jdeps-trimmed subset (trimFastutil):
        // the static closure of what the embedded code references (~100 classes) instead of the
        // 16,204 the core jar ships. See the trim task for why this is exact, not a heuristic.
        exclude(dependency('it.unimi.dsi:fastutil-core'))
    }

    from(trimFastutil)


    manifest {
        attributes(
            'Main-Class': 'io.jafar.mcp.Main',
            // Read back at runtime for the MCP handshake's serverInfo.version. Without it the
            // server has to carry a literal, which is how it came to advertise 0.10.0 for sixteen
            // releases.
            'Implementation-Version': component_version,
        )
    }
}

tasks.named('build') {
    dependsOn shadowJar
}

group = 'io.btrace'
version = component_version
description = 'MCP Server for JFR analysis - enables AI agents to analyze Java Flight Recordings'

// Configure Maven publishing to use shadow JAR
mavenPublishing {
    coordinates('io.btrace', 'jfr-mcp', version.toString())
}

// Override publication to use shadow JAR instead of regular JAR
afterEvaluate {
    publishing {
        publications {
            maven(MavenPublication) {
                // Remove the thin jar artifact added by the vanniktech plugin, and the shadow
                // artifact the plugin adds under classifier 'all': the same file is re-added
                // below as the main (classifier '') artifact, and publishing both sent every
                // fat jar to Maven Central twice per release.
                artifacts.removeIf { it.extension == 'jar' && (it.classifier == null || it.classifier == 'all') && !it.file.name.endsWith('-sources.jar') && !it.file.name.endsWith('-javadoc.jar') }
                // Add shadow JAR as main artifact
                artifact(shadowJar) {
                    classifier = ''  // Publish without classifier
                }
                // Remove internal modules from POM (they are embedded in the shadow JAR)
                pom.withXml {
                    def deps = asNode().get('dependencies')
                    if (deps) {
                        deps.each { depsNode ->
                            depsNode.children().removeAll { dep ->
                                dep.groupId.text() == 'io.btrace'
                            }
                        }
                    }
                }
            }
        }
    }
}

// Disable Gradle module metadata for jfr-mcp (it's a distribution, not a library)
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
