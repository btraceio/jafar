plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish'
}

// Per-plane tag-derived version (see gradle/version-from-tag.gradle)
apply from: rootProject.file('gradle/version-from-tag.gradle')

def libraryName = "jfr-shell-jafar"
// Backend plugins sync with main project version
def component_version = project.version

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Only depends on shell-core for the SPI interfaces (compile-only)
    compileOnly project(':shell-core')

    // Depends on jafar parser for actual parsing implementation
    implementation project(':parser')

    // Unit tests for logic that needs no recording (e.g. merging class definitions across
    // chunks). Behaviour against real recordings is tested from jfr-shell, which loads this backend.
    testImplementation project(':shell-core') // the SPI the sources implement
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'JFR Shell Jafar Backend',
            'Implementation-Version': component_version
        )
    }
}

group = 'io.btrace'
version = component_version
description = 'Jafar parser backend for jfr-shell - high-performance JFR parser'
