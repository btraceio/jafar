plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish'
}

// Per-plane tag-derived version (see gradle/version-from-tag.gradle)
apply from: rootProject.file('gradle/version-from-tag.gradle')

def libraryName = "jfr-shell-jdk"
// Backend plugins sync with main project version
def component_version = project.version

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Only depends on shell-core for the SPI interfaces
    compileOnly project(':shell-core')
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'JFR Shell JDK Backend',
            'Implementation-Version': component_version
        )
    }
}

group = 'io.btrace'
version = component_version
description = 'JDK JFR API backend for jfr-shell - provides alternative parser using standard JDK APIs'
