plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish'
}

// Per-plane tag-derived version (see gradle/version-from-tag.gradle)
apply from: rootProject.file('gradle/version-from-tag.gradle')

def component_version = project.hasProperty("jafar_version") ? project.jafar_version : project.version

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // No provider SDK: the OpenAI chat-completions shape is small enough to speak directly with
    // the JDK's HttpClient. The shell provides shell-core (the SPI) at runtime, so this module's
    // jar alone resolves everything it needs off its POM at install time.
    compileOnly project(':shell-core')
    testImplementation project(':shell-core')
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

group = 'io.btrace'
version = component_version
description = 'OpenAI-compatible LLM backend for the Jafar shells (OpenAI, Ollama, vLLM, LM Studio)'
