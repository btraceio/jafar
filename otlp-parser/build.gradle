plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish'
}

// Per-plane tag-derived version (see gradle/version-from-tag.gradle)
apply from: rootProject.file('gradle/version-from-tag.gradle')

def libraryName = "otlp-parser"
def component_version = project.hasProperty("jafar_version") ? project.jafar_version : project.version

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Shared protobuf wire-format decoding (ProtoUtil)
    implementation project(':parser-core')

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    // Allocation meter + budgets (test-support); the parse is single-threaded, so the budget
    // test runs in the normal `test` task (D9) — no dedicated allocationTest task here.
    testImplementation project(':test-support')
}

def allocationBudgetsFile = rootProject.file('gradle/allocation-budgets.properties')

test {
    useJUnitPlatform()
    // Allocation budget gate (T15): the budgets file is a task input, so a budget change re-runs
    // the gate; the fixture is built by the test, so there is no fixture file to declare.
    systemProperty 'jafar.alloc.budgets', allocationBudgetsFile.absolutePath
    inputs.file allocationBudgetsFile
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

// Keep test fixtures (MinimalOtlpBuilder) out of the published artifact
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

group = 'io.btrace'
version = component_version
description = 'Fast OpenTelemetry Profiling (OTLP) parser with minimal API'

mavenPublishing {
    coordinates('io.btrace', 'jafar-otlp-parser', version.toString())
}
