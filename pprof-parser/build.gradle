plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish'
}

// Per-plane tag-derived version (see gradle/version-from-tag.gradle)
apply from: rootProject.file('gradle/version-from-tag.gradle')

def libraryName = "pprof-parser"
def component_version = project.hasProperty("jafar_version") ? project.jafar_version : project.version

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    jmh {
        java {
            srcDirs = ["src/main/jmh/java"]
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    jmhImplementation {
        extendsFrom configurations.implementation
    }
}

dependencies {
    // Shared protobuf wire-format decoding (ProtoUtil)
    implementation project(':parser-core')

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

test {
    useJUnitPlatform()
}

// JMH benchmark task
tasks.register('jmh', JavaExec) {
    description = 'Runs JMH benchmarks'
    group = 'verification'
    dependsOn compileJmhJava
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass.set('org.openjdk.jmh.Main')
    workingDir = rootProject.projectDir

    if (project.hasProperty('jmhArgs')) {
        setArgs(Arrays.asList(project.jmhArgs.split(' ')))
    }
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

// Keep test fixtures (MinimalPprofBuilder) out of the published artifact
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

group = 'io.btrace'
version = component_version
description = 'Fast pprof profile parser with minimal API'

mavenPublishing {
    coordinates('io.btrace', 'jafar-pprof-parser', version.toString())
}
