pluginManagement {
    // Let builds resolve the in-repo Gradle plugin by ID without publishing
    includeBuild('jafar-gradle-plugin')
    repositories {
        mavenLocal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        gradlePluginPortal()
    }
}

// Toolchain auto-provisioning: the runner images (ubuntu-latest since 2026-11, ubuntu-26.04)
// no longer preinstall JDK 8, and the build's configure phase resolves the :parser toolchain-8
// eagerly (the jfr-mcp publishing block reads component artifacts at configuration time), so
// a machine without the JDKs already installed fails every Gradle invocation before any
// task runs. The resolver downloads a missing JDK from the Foojay Disco API on first use and
// caches it under ~/.gradle/jdks; locally installed JDKs are always preferred when found.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Wire the plugin build to use the in-repo parser project instead of a published module
includeBuild('jafar-gradle-plugin') {
    dependencySubstitution {
        substitute(module("io.btrace:jafar-parser")).using(project(":parser"))
        substitute(module("io.btrace:jafar-parser-core")).using(project(":parser-core"))
        substitute(module("io.btrace:jafar-parser-codegen")).using(project(":parser-codegen"))
    }
}

rootProject.name = 'jafar'
include ':parser'
include ':parser-core'
include ':parser-codegen'
include ':jafar-processor'
include ':tools'
include ':test-recordings'
include ':shell-core'
include ':llm-anthropic'
include ':llm-openai'
include ':jfr-shell'
include ':jfr-shell-jdk'
include ':jfr-shell-jafar'
include ':jfr-shell-tck'
include ':jfr-mcp'
include ':hdump-parser'
include ':hdump-shell'
include ':pprof-parser'
include ':pprof-shell'
include ':otlp-parser'
include ':otlp-shell'
include ':jafar-shell'
include ':jfr2pprof'
